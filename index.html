<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Yana, Will You Be My Valentine? </title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Nunito:wght@500;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <canvas id="confettiCanvas" aria-hidden="true"></canvas>

    <main class="card">
      <p class="kicker">Oye Mere POOPOOPAKODE</p>
      <h1>, Will You Be My Valentine 🥺🥺🥺🥺🥺?</h1>
      <p class="message">
        Tum Na bologe Toh Hum Bura Nahi Maanenge, Bas Window Puri Khol Dena Humare Liye 😖😩😫
      </p>

      <div class="button-row">
        <button id="yesBtn" class="bubble yes" type="button">Yes 😋</button>
        <button id="noBtn" class="bubble no" type="button" aria-label="No">
          No 🤢🤮
        </button>
      </div>

      <p id="result" class="result" aria-live="polite"></p>
    </main>

    <script src="script.js"></script>
  </body>
</html>
